{% set version = "1.1.0" %}
{% set python_min = "3.11" %}

package:
  name: "calt-x"
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/c/calt-x/calt_x-{{ version }}.tar.gz
  sha256: 54940328b3759ce1b0b7bf9c21d386559a7b164d6b949df3a412724bd74649e7
  patches:
    - python-version.patch

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=65
    - pip
  run:
    - python >={{ python_min }},<3.14
    - transformers >=4.49.0
    - omegaconf >=2.3.0
    - pytorch >=2.6.0
    - wandb >=0.15.11
    - accelerate >=0.29.0
    - joblib >=1.5.0
    - sympy >=1.12
    - ipython >=8.18.1

test:
  imports:
    - calt
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/HiroshiKERA/calt
  summary: A library for computational algebra using Transformers
  dev_url: https://github.com/HiroshiKERA/calt
  doc_url: https://hiroshikera.github.io/calt/
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - sugarl-sudo
